"%instana":
  quarkus:
    observability:
      lgtm:
        enabled: false
    otel:
      resource:
        attributes: INSTANA_PLUGIN=genai
      exporter:
        otlp:
          endpoint: https://otlp-http-orange-saas.instana.io:443
          headers: x-instana-key=uBp4GXpZQpKrHxMXNcvInQ,x-instana-host=edeandrea-m4max
          protocol: http/protobuf

"%drift":
  quarkus:
    config:
      profile:
        parent: langfuse-ocp
    aiscoring:
      interaction-mode: drift-detection
    otel:
      exporter:
        otlp:
          enabled: false
      logs:
        enabled: false
      sdk:
        disabled: true
    observability:
      enabled: false
    micrometer:
      export:
        otlp:
          enabled: false

"%langfuse-ocp":
  quarkus:
    otel:
      exporter:
        otlp:
          enabled: false
    observability:
      lgtm:
        enabled: false
    langfuse:
      base-url: https://langfuse-web-parasol.apps.cluster-89g4g.dyn.redhatworkshops.io
      public-key: pk-lf-b30687d2-4eb0-471b-a45d-38abe41b6a10
      secret-key: sk-lf-fef063e9-0806-49cb-b0fd-cfabdb2f9d04
      log-requests: true
      log-responses: true
      pretty-print: true
      devservices:
        enabled: false

    aiscoring:
      langfuse:
        evaluation:
          session:
            score-session: false

quarkus:
  transaction-manager:
    default-transaction-timeout: 3m

  application:
    name: parasol-app

  langfuse:
    environment: dev

  # Default LangChain4j configuration
  langchain4j:
    parasol-chat:
      chat-model:
        provider: openai
    embedding-model:
      provider: openai

    log-requests: true
    log-responses: true

    tracing:
      include-prompt: true
      include-completion: true
      include-tool-arguments: true
      include-tool-result: true

    # RAG
    easy-rag:
      path: policies
      path-type: classpath
      reuse-embeddings:
        enabled: true

    # OpenAI
    # temperature/top-p are set explicitly on every chat model because quarkus-langchain4j 1.14+ no longer sends
    # them unless configured; these values preserve the pre-1.14 defaults (temperature 1.0, top-p 1.0)
    openai:
      api-key: "${OPENAI_API_KEY}"
      parasol-chat:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      generate-email:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      politeness:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      session-sentiment:
        chat-model:
          model-name: command-r7b-12-2024
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${COHERE_API_KEY}"
        base-url: https://api.cohere.ai/compatibility/v1
      judge:
        chat-model:
          model-name: command-r7b-12-2024
          temperature: 0
          top-p: 1
        timeout: 600s
        api-key: "${COHERE_API_KEY}"
        base-url: https://api.cohere.ai/compatibility/v1

    # Ollama
    ollama:
      parasol-chat:
        timeout: 600s
        chat-model:
          model-id: granite4:micro
          temperature: 0.3
      generate-email:
        timeout: 600s
        chat-model:
          # Not granite4:micro like the others: EmailEndsAppropriatelyOutputGuardrail needs EMAIL_ENDING reproduced
          # verbatim, and granite4:micro (like llama3.2, ministral-3:3b and qwen2.5:3b) reflows it - it collapses the
          # three disclaimer lines onto one - so the guardrail reprompts until max-retries. qwen3:4b reproduces it.
          model-id: qwen3:4b
          temperature: 0.3
          model-options:
            # qwen3 reasons by default: ~6k thinking tokens per email, which is minutes on a CI runner. Off, it's ~140.
            # This only reaches the Ollama-native API, which is why %ollama-openai stays on parasol-chat's model id.
            think: false
      politeness:
        timeout: 600s
        chat-model:
          model-id: granite4:micro
          temperature: 0.3
      session-sentiment:
        timeout: 600s
        chat-model:
          model-id: granite4:micro
          temperature: 0
      judge:
        timeout: 600s
        chat-model:
          model-id: granite4:micro
          temperature: 0
      embedding-model:
        model-id: snowflake-arctic-embed

  # Mail
  # Send through GreenMail from compose-devservices.yml (the port is mapped in by the compose labels).
  # Set at root rather than %dev so it also applies when dev mode runs as <ai>,prod (-Pollama / -Pollama-openai)
  # host: Compose Dev Services publish GreenMail's ports on the container runtime's host and can't map the host name
  # into config, so this assumes a local Docker/Podman. GreenMailMailbox (tests) reuses it for IMAP and the REST API.
  # Kubernetes overrides it with the greenmail Service (parasol-app-config ConfigMap)
  mailer:
    tls: false
    mock: false
    host: localhost

  # Also start Roundcube (http://localhost:8000) from compose-devservices.yml in dev mode, whatever the
  # config profile (Dev Services follow the launch mode, so this has no effect in prod). Turned off in %test
  compose:
    devservices:
      profiles: webmail

  # HTTP
  http:
    cors:
      enabled: true
      origins: '*'
  dev-ui:
    cors:
      enabled: true
  tls:
    trust-all: true

  # Jackson
  rest:
    jackson:
      optimization:
        enable-reflection-free-serialization: true

  jackson:
    serialization-inclusion: non-empty

  # Hibernate
  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

  # Quinoa
  quinoa:
    build-dir: dist
    enable-spa-routing: true
    package-manager-install:
      ~: true
      node-version: 24.21.0
      npm-version: 11.21.0

  # OpenAPI
  smallrye-openapi:
    info-title: Non Deterministic? No Problem!
    info-description: Demo application to show how to test non-deterministic systems
    info-version: 1.0
    info-contact-name: Eric Deandrea
    info-contact-url: https://github.com/edeandrea
  swagger-ui:
    always-include: true

  # Container image
  container-image:
    builder: docker
    group: edeandrea
    name: "${quarkus.application.name}"

  # Websockets
  websockets-next:
    server:
      auto-ping-interval: 1m

  # OpenTelemetry and tracing
  otel:
    logs:
      enabled: true
    metrics:
      enabled: true
  datasource:
    metrics:
      enabled: true
    jdbc:
      telemetry: true

  # REST Clients
  rest-client:
    follow-redirects: true

# Ollama profile config
'%ollama':
  quarkus:
    aiscoring:
      langfuse:
        evaluation:
          session:
            score-session: false
          initialize-on-startup: false
    langchain4j:
      openai:
        api-key: changeme
        session-sentiment:
          api-key: changeme
        judge:
          api-key: changeme
      parasol-chat:
        chat-model:
          provider: ollama
      generate-email:
        chat-model:
          provider: ollama
      politeness:
        chat-model:
          provider: ollama
      embedding-model:
        provider: ollama

# Ollama using OpenAI endpoint profile config
'%ollama-openai':
  quarkus:
    langchain4j:
      openai:
        base-url: http://localhost:11434/v1
        parasol-chat:
          base-url: "${%ollama-openai.quarkus.langchain4j.openai.base-url}"
          chat-model:
            model-name: "${quarkus.langchain4j.ollama.parasol-chat.chat-model.model-id}"
        generate-email:
          base-url: "${%ollama-openai.quarkus.langchain4j.openai.base-url}"
          chat-model:
            model-name: "${quarkus.langchain4j.ollama.parasol-chat.chat-model.model-id}"
        politeness:
          base-url: "${%ollama-openai.quarkus.langchain4j.openai.base-url}"
          chat-model:
            model-name: "${quarkus.langchain4j.ollama.parasol-chat.chat-model.model-id}"
        embedding-model:
          model-name: "${quarkus.langchain4j.ollama.embedding-model.model-id}"

# Dev mode config
'%dev':
  quarkus:
    datasource:
      dev-ui:
        allow-sql: true

# Dev and test modes config
'%dev,test':
  quarkus:
    langfuse:
      log-requests: true
      log-responses: true
      pretty-print: true

    log:
      category:
        'org.parasol':
          level: DEBUG
        'ai.scoring':
          level: DEBUG
        'ai.scoring.events.api':
          level: DEBUG
        'io.quarkiverse.langchain4j.testing.evaluation':
          level: DEBUG
      console:
        level: DEBUG

# test mode config
'%test':
  quarkus:
    # GreenMail only in tests, no Roundcube. Covers IDE runs and continuous testing; Maven builds also force
    # quarkus.compose.devservices.profiles=none from surefire/failsafe, which covers config profiles without 'test'
    compose:
      devservices:
        profiles: ""

    aiscoring:
      langfuse:
        evaluation:
          session:
            score-session: false
          initialize-on-startup: false

    otel:
      exporter:
        otlp:
          enabled: false
      logs:
        enabled: false
    observability:
      enabled: false
    micrometer:
      export:
        otlp:
          enabled: "${%test.quarkus.observability.enabled}"

# Prod mode config
'%prod':
  quarkus:
    hibernate-orm:
      sql-load-script: import.sql
      schema-management:
        strategy: drop-and-create

'%openshift':
  quarkus:
    config:
      profile:
        parent: prod
    hibernate-orm:
      sql-load-script: import.sql
      schema-management:
        strategy: drop-and-create
    kubernetes:
      deployment-target: openshift
    container-image:
      builder: openshift
      registry: image-registry.openshift-image-registry.svc:5000
    openshift:
      part-of: parasol-insurance
      base-jvm-image: registry.access.redhat.com/ubi10/openjdk-25:1.24
      labels:
        app: non-deterministic
      env:
        configmaps: parasol-app-config
        secrets: parasol-db-creds,parasol-app-creds
      route:
        expose: true
        tls:
          termination: edge
          insecure-edge-termination-policy: Redirect
      annotations:
        "app.openshift.io/connects-to": non-deterministic-db,grafana-lgtm,greenmail,langfuse-web
