"%instana":
  quarkus:
    observability:
      lgtm:
        enabled: false
    otel:
      resource:
        attributes: INSTANA_PLUGIN=genai
      exporter:
        otlp:
          endpoint: https://otlp-http-orange-saas.instana.io:443
          headers: x-instana-key=uBp4GXpZQpKrHxMXNcvInQ,x-instana-host=edeandrea-m4max
          protocol: http/protobuf

"%drift":
  aiscoring:
    interaction-mode: drift-detection
  quarkus:
    config:
      profile:
        parent: langfuse-ocp
    otel:
      exporter:
        otlp:
          enabled: false
      logs:
        enabled: false
      sdk:
        disabled: true
    observability:
      enabled: false

"%langfuse-ocp":
  aiscoring:
    langfuse:
      evaluation:
        session:
          score-session: false
  quarkus:
    otel:
      exporter:
        otlp:
          enabled: false
    observability:
      lgtm:
        enabled: false
    langfuse:
      base-url: https://langfuse-web-papp.apps.cluster-4ncrc.dyn.redhatworkshops.io
      public-key: pk-lf-b30687d2-4eb0-471b-a45d-38abe41b6a10
      secret-key: sk-lf-fef063e9-0806-49cb-b0fd-cfabdb2f9d04
      log-requests: true
      log-responses: true
      pretty-print: true
      devservices:
        enabled: false

quarkus:
  transaction-manager:
    default-transaction-timeout: 3m

  observability:
    lgtm:
      # The cluster's image (src/main/kubernetes/dependencies.yml): change both together
      image-name: docker.io/grafana/otel-lgtm:0.38.1
      # Metrics reach LGTM by OTLP push only; without this the dev service also scrapes /q/metrics and every series arrives twice
      force-scraping: false

  application:
    # Also quarkus-flow's application_id, which is part of the primary key of all three Flow tables: renaming the
    # application orphans every waiting intake run
    name: parasol-app

  flow:
    persistence:
      # Flow's startup restore replays a persisted run from its first incomplete task (mail sent twice), and every application instance
      # would do it, since they share the application id. ReviewReclaimer gives a review whose run is gone a new run instead, which only waits.
      auto-restore: false
    validation:
      input:
        # quarkus-flow 1.3.0 turns this on by default (quarkiverse/quarkus-flow#1077). For a quarkus-flow-langchain4j
        # generated agentic workflow (ClaimsMailboxAgent, ClaimExtractionWorkflow) the generated schema is
        # unsatisfiable: it marks every field of every record in the agent topology as required, with no
        # nullable/Optional support, including fields that are the agentic system's own not-yet-computed outputs and
        # the InvocationParameters execution-context parameter (which langchain4j-agentic deliberately keeps out of
        # AgenticScope.state()). There is no way to scope this flag to just the hand-authored ClaimIntakeFlow, whose
        # own IntakeRun input is unaffected. Filed upstream as quarkiverse/quarkus-flow#1111; re-enable once it's
        # addressed there.
        enabled: false

  langfuse:
    environment: dev

  # Default LangChain4j configuration
  # Every named model is pinned to openai here, unconditionally, not just under the default profile: once
  # quarkus-langchain4j-ollama is on the classpath (-Pollama), both providers' deployment processors are active
  # for every config profile that Maven profile builds (drift, langfuse-ocp, test, ollama-openai - not just %ollama
  # itself), so a model reachable through both provider namespaces needs a provider resolved in every one of them or
  # the build fails with "multiple available providers" (#290: this is what broke the %drift-profile augmentation
  # once the Ollama block's per-model sub-nodes moved from root into %ollama). %ollama overrides five of these back
  # to ollama; session-sentiment and judge never are (see Models section)
  langchain4j:
    parasol-chat:
      chat-model:
        provider: openai
    generate-email:
      chat-model:
        provider: openai
    politeness:
      chat-model:
        provider: openai
    claim-intake:
      chat-model:
        provider: openai
    session-sentiment:
      chat-model:
        provider: openai
    judge:
      chat-model:
        provider: openai
    embedding-model:
      provider: openai

    log-requests: true
    log-responses: true

    tracing:
      include-prompt: true
      include-completion: true
      include-tool-arguments: true
      include-tool-result: true

    # RAG
    easy-rag:
      path: policies
      path-type: classpath
      reuse-embeddings:
        enabled: true

    # OpenAI
    # temperature/top-p are set explicitly on every chat model because quarkus-langchain4j 1.14+ no longer sends
    # them unless configured; these values preserve the pre-1.14 defaults (temperature 1.0, top-p 1.0)
    openai:
      api-key: "${OPENAI_API_KEY}"
      parasol-chat:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      generate-email:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      politeness:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      claim-intake:
        chat-model:
          model-name: gpt-5-mini
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${quarkus.langchain4j.openai.api-key}"
      session-sentiment:
        chat-model:
          model-name: command-r7b-12-2024
          temperature: 1
          top-p: 1
        timeout: 600s
        api-key: "${COHERE_API_KEY}"
        base-url: https://api.cohere.ai/compatibility/v1
      judge:
        chat-model:
          model-name: command-r7b-12-2024
          temperature: 0
          top-p: 1
        timeout: 600s
        api-key: "${COHERE_API_KEY}"
        base-url: https://api.cohere.ai/compatibility/v1

  # Mail
  # Send through GreenMail from compose-devservices.yml (the port is mapped in by the compose labels).
  # Set at root rather than %dev so it also applies when dev mode runs as <ai>,prod (-Pollama / -Pollama-openai)
  # host: Compose Dev Services publish GreenMail's ports on the container runtime's host and can't map the host name
  # into config, so this assumes a local Docker/Podman. GreenMailMailbox (tests) reuses it for IMAP and the REST API.
  # Kubernetes overrides it with the greenmail Service (parasol-app-config ConfigMap)
  mailer:
    tls: false
    mock: false
    host: localhost

  # Also start Roundcube (http://localhost:8000) from compose-devservices.yml in dev mode, whatever the
  # config profile (Dev Services follow the launch mode, so this has no effect in prod). Turned off in %test.
  # ROUNDCUBE_PORT is its host port: compose-devservices.yml can't default it itself (Quarkus parses the file and can't
  # read ${VAR:-default}). The Playwright tests' UiTestProfile sets it to 0, a random port
  compose:
    devservices:
      profiles: webmail
      env-variables:
        ROUNDCUBE_PORT: 8000

  # HTTP
  http:
    cors:
      enabled: true
      origins: '*'
  tls:
    trust-all: true

  # Jackson
  rest:
    jackson:
      optimization:
        enable-reflection-free-serializers: true

  jackson:
    serialization-inclusion: non-empty

  # Hibernate
  hibernate-orm:
    physical-naming-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    # Flyway owns the schema; Hibernate only checks the entities still match it
    schema-management:
      strategy: validate

  # Flyway: the app's migrations (db/migration) on the default configuration, Flow's own (quarkus-flow-db-migration)
  # on the named flow-runtime one. Both share schema public, so each baselines the other's tables away
  flyway:
    migrate-at-start: true
    baseline-on-migrate: true
    baseline-version: "0"
    flow-runtime:
      migrate-at-start: true
      baseline-on-migrate: true
      baseline-version: "0"
      table: flyway_flow_runtime_history
      locations: db/flow-migration/runtime/postgresql

  # Quinoa
  quinoa:
    build-dir: dist
    enable-spa-routing: true
    package-manager-install:
      ~: true
      node-version: 24.21.0
      npm-version: 11.21.0

  # OpenAPI
  smallrye-openapi:
    info-title: Non Deterministic? No Problem!
    info-description: Demo application to show how to test non-deterministic systems
    info-version: 1.0
    info-contact-name: Eric Deandrea
    info-contact-url: https://github.com/edeandrea
  swagger-ui:
    always-include: true

  # Container image
  container-image:
    builder: docker
    group: edeandrea
    name: "${quarkus.application.name}"

  # Websockets
  websockets-next:
    server:
      auto-ping-interval: 1m

  # OpenTelemetry and tracing
  otel:
    logs:
      enabled: true
    metrics:
      enabled: true
  datasource:
    # Explicit, because the flow-runtime datasource below stops the default one being implied
    db-kind: postgresql
    metrics:
      enabled: true
    jdbc:
      telemetry: true
    # Flyway only: Flow's migrations run on this named datasource, which points at the same database. Flow's entities
    # stay in the default persistence unit
    flow-runtime:
      db-kind: "${quarkus.datasource.db-kind}"
      jdbc:
        url: "${quarkus.datasource.jdbc.url}"
      username: "${quarkus.datasource.username}"
      password: "${quarkus.datasource.password}"

  # REST Clients
  rest-client:
    follow-redirects: true

parasol:
  # The sign-off on every customer email. No @ConfigMapping reads these: GenerateEmailService.EMAIL_ENDING, the
  # intake's templates (templates/IntakeTemplates) and EmailEndsAppropriatelyOutputGuardrail read them through Qute's
  # config: namespace, so there's no Java default and they must stay set here
  claims-department:
    name: Parasol Insurance Claims Department
    phone: 1-800-CAR-SAFE
  # Email claim intake (IntakeConfig). The IMAP host and port default to the GreenMail the app sends through
  intake:
    address: claims@parasol.com
  # What "the real model" means under the active config profile. %test stubs the models outright, and UiTestProfile
  # has to point its own back at the real ones - but it cannot hard-code openai / https://api.openai.com/v1, which
  # are wrong under -Pollama and -Pollama-openai. %test WINS over %ollama and %ollama-openai (multiple profiles
  # resolve right-to-left: ProfileConfigSourceInterceptor reverses the list), so the un-stubbing has to come from a
  # key the Maven profiles own.
  models:
    provider: openai
    base-url: https://api.openai.com/v1
    # The Ollama model ids live here, not under quarkus.langchain4j.ollama.*, because %ollama-openai needs two of
    # them and that config root only exists when the Ollama extension is on the classpath (-Pollama). A key outside
    # the `quarkus.` namespace is also never reported as an unrecognized configuration key - see #290
    ollama:
      chat-model-id: granite4:micro
      # Not granite4:micro like the others: EmailEndsAppropriatelyOutputGuardrail needs EMAIL_ENDING reproduced
      # verbatim, and granite4:micro (like llama3.2, ministral-3:3b and qwen2.5:3b) reflows it - it collapses the
      # three disclaimer lines onto one - so the guardrail reprompts until max-retries. qwen3:4b reproduces it
      email-model-id: qwen3:4b
      embedding-model-id: snowflake-arctic-embed

# Ollama profile config
'%ollama':
  aiscoring:
    langfuse:
      evaluation:
        session:
          score-session: false
        initialize-on-startup: false
  parasol:
    models:
      provider: ollama
  quarkus:
    langchain4j:
      openai:
        api-key: changeme
        session-sentiment:
          api-key: changeme
        judge:
          api-key: changeme
      parasol-chat:
        chat-model:
          provider: ollama
      generate-email:
        chat-model:
          provider: ollama
      politeness:
        chat-model:
          provider: ollama
      claim-intake:
        chat-model:
          provider: ollama
      embedding-model:
        provider: ollama

      # Ollama
      ollama:
        parasol-chat:
          timeout: 600s
          chat-model:
            model-id: "${parasol.models.ollama.chat-model-id}"
            temperature: 0.3
        generate-email:
          timeout: 600s
          chat-model:
            model-id: "${parasol.models.ollama.email-model-id}"
            temperature: 0.3
            model-options:
              # qwen3 reasons by default: ~6k thinking tokens per email, which is minutes on a CI runner. Off, it's ~140.
              # This only reaches the Ollama-native API, which is why %ollama-openai stays on the chat model id.
              think: false
        politeness:
          timeout: 600s
          chat-model:
            model-id: "${parasol.models.ollama.chat-model-id}"
            temperature: 0.3
        claim-intake:
          timeout: 600s
          chat-model:
            # Same as generate-email
            model-id: "${parasol.models.ollama.email-model-id}"
            temperature: 0.3
            model-options:
              think: false
        session-sentiment:
          timeout: 600s
          chat-model:
            model-id: "${parasol.models.ollama.chat-model-id}"
            temperature: 0
        judge:
          timeout: 600s
          chat-model:
            model-id: "${parasol.models.ollama.chat-model-id}"
            temperature: 0
        embedding-model:
          model-id: "${parasol.models.ollama.embedding-model-id}"

# Ollama using OpenAI endpoint profile config
'%ollama-openai':
  parasol:
    models:
      base-url: http://localhost:11434/v1
  quarkus:
    langchain4j:
      openai:
        base-url: "${parasol.models.base-url}"
        parasol-chat:
          base-url: "${parasol.models.base-url}"
          chat-model:
            model-name: "${parasol.models.ollama.chat-model-id}"
        generate-email:
          base-url: "${parasol.models.base-url}"
          chat-model:
            model-name: "${parasol.models.ollama.chat-model-id}"
        politeness:
          base-url: "${parasol.models.base-url}"
          chat-model:
            model-name: "${parasol.models.ollama.chat-model-id}"
        claim-intake:
          base-url: "${parasol.models.base-url}"
          chat-model:
            model-name: "${parasol.models.ollama.chat-model-id}"
        embedding-model:
          model-name: "${parasol.models.ollama.embedding-model-id}"

# Dev mode config
'%dev':
  quarkus:
    datasource:
      dev-ui:
        allow-sql: true
  parasol:
    # A build property: the Ollama Maven profiles set it for quarkus:dev in the pom
    dev-seed:
      enabled: true
    intake:
      watcher:
        # Quick pick-up of mail sent from Roundcube if a wake-up is missed
        idle-refresh: 10s

# Dev and test modes config
'%dev,test':
  quarkus:
    langfuse:
      log-requests: true
      log-responses: true
      pretty-print: true

    log:
      category:
        'org.parasol':
          level: DEBUG
        'ai.scoring':
          level: DEBUG
        'ai.scoring.events.api':
          level: DEBUG
        'io.quarkiverse.langchain4j.testing.evaluation':
          level: DEBUG
      console:
        level: DEBUG

# test mode config
#
# C1 - precedence gotcha: multiple active profiles resolve RIGHT-TO-LEFT (ProfileConfigSourceInterceptor reverses the
# list), and the pom sets quarkus.test.profile=ollama,test / =ollama-openai,test, so %test is always the last-listed
# profile and WINS over %ollama and %ollama-openai. Any key set here therefore silently overrides both Maven
# profiles - that is why the model stubbing below works at all, and why parasol.models.* (read back by UiTestProfile
# to get "the real model" under whichever Maven profile is active) is owned by the Maven profiles, never by %test.
'%test':
  aiscoring:
    langfuse:
      evaluation:
        session:
          score-session: false
        initialize-on-startup: false
  quarkus:
    # Every test boot starts from the seeded database. Both Flyway configurations share schema public and clean all of it, so
    # only the one that migrates first may clean: flow-runtime does (Quarkus runs it before the default one), and the default
    # one then finds an empty schema with its history gone
    flyway:
      flow-runtime:
        clean-at-start: true
        clean-disabled: false
    # GreenMail only in tests, no Roundcube. Covers IDE runs and continuous testing; Maven builds also force
    # quarkus.compose.devservices.profiles=none from surefire/failsafe, which covers config profiles without 'test'.
    # The Playwright tests' UiTestProfile overrides both and starts Roundcube on a random port
    compose:
      devservices:
        profiles: ""

    # Build-time: removes only the span processor that exports to Langfuse. The SDK, the dev service and LangfuseOperations stay
    langfuse:
      otel:
        enabled: false

    otel:
      exporter:
        otlp:
          enabled: false
      logs:
        enabled: false
      # So TestSpans sees a run's spans soon after they end
      bsp:
        schedule:
          delay: 100ms
    observability:
      enabled: false

    # For the tests that assert what a request loads (e.g. ClaimRetrievalHasNoIntakeBookkeepingTests)
    hibernate-orm:
      statistics: true

    # Model stubbing: every test gets a stubbed model unless it @InjectMocks the AI service or never references one.
    # Only NotificationServiceTests.emailSendsWhenUserExists (generate-email/politeness) and
    # ClaimsDetailPageTests.pageLoads (parasol-chat, via UiTestProfile) keep a live model - see C2 below.
    langchain4j:
      # C2 - named OpenAI clients do NOT inherit the unnamed client's config: each named group carries its own
      # @WithDefault base-url/api-key and OpenAiRecorder resolves defaultConfig() vs namedConfig().get(name) with no
      # fallback. So stubbing the unnamed client's base-url/api-key here does not touch generate-email or politeness
      # - they keep real keys and real models, by design. Do not add base-url/api-key entries for them here.
      easy-rag:
        # Quoted: unquoted OFF/ON/YES/NO parse as YAML 1.1 booleans, which fails this enum's conversion
        ingestion-strategy: "OFF"
      # Load-bearing, not redundant: %ollama would otherwise route these around the stubs into a real model
      parasol-chat:
        chat-model:
          provider: openai
      claim-intake:
        chat-model:
          provider: openai
      embedding-model:
        provider: openai
      openai:
        # The unnamed client, which is also the default embedding model
        base-url: "${parasol.test.wiremock-base-url}"
        parasol-chat:
          api-key: changeme
          base-url: "${parasol.test.wiremock-base-url}"
        claim-intake:
          api-key: changeme
          base-url: "${parasol.test.wiremock-base-url}"
          chat-model:
            model-name: claim-intake-model
        session-sentiment:
          api-key: changeme
        judge:
          api-key: changeme

  # Only the watcher tests turn the intake on
  parasol:
    intake:
      enabled: false
    # Kept inside %test so it is never an active key in the production jar
    test:
      wiremock-base-url: "http://localhost:${quarkus.wiremock.devservices.port}/v1"

# Prod mode config
'%openshift':
  quarkus:
    config:
      profile:
        parent: prod
    kubernetes:
      deployment-target: openshift
    container-image:
      builder: openshift
      registry: image-registry.openshift-image-registry.svc:5000
    openshift:
      # The intake is safe to scale (`oc scale deployment/parasol-app --replicas=3`): one application instance leads it
      # (a Kubernetes Lease, see parasol.intake.leadership below), every instance serves the UI, REST and chat. The default
      # stays one replica. The app has no PVC, so the default RollingUpdate is fine: the new instance becomes ready as a
      # follower and takes the Lease when the old one releases it on shutdown. See README -> Scaling.
      replicas: 1
      part-of: parasol-insurance
      base-jvm-image: registry.access.redhat.com/ubi10/openjdk-25:1.24
      labels:
        app: non-deterministic
      env:
        configmaps: parasol-app-config
        secrets: parasol-db-creds,parasol-app-creds
      route:
        expose: true
        tls:
          termination: edge
          insecure-edge-termination-policy: Redirect
      annotations:
        "app.openshift.io/connects-to": non-deterministic-db,grafana-lgtm,greenmail,langfuse-web
      # Least privilege for the intake leader's Lease; the Lease identity is the pod name (the host name)
      rbac:
        roles:
          intake-lease:
            policy-rules:
              leases:
                api-groups: coordination.k8s.io
                resources: leases
                verbs: get,create,update
        role-bindings:
          intake-lease:
            role-name: intake-lease
    kubernetes-client:
      generate-rbac: false
  parasol:
    intake:
      leadership:
        mode: kubernetes-lease
