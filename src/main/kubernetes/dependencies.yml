---
apiVersion: v1
kind: ConfigMap
metadata:
  name: parasol-app-config
data:
  quarkus.langfuse.base-url: http://langfuse-web:3000
  quarkus.langfuse.public-key: pk-lf-b30687d2-4eb0-471b-a45d-38abe41b6a10
  quarkus.langfuse.secret-key: sk-lf-fef063e9-0806-49cb-b0fd-cfabdb2f9d04
  quarkus.aiscoring.langfuse.evaluation.initialize-on-startup: "true"
  quarkus.datasource.jdbc.url: jdbc:postgresql://non-deterministic-db:5432/non_deterministic
  quarkus.otel.exporter.otlp.endpoint: http://lgtm:4318
  quarkus.otel.exporter.otlp.protocol: http/protobuf
  quarkus.mailer.host: greenmail
  quarkus.mailer.mock: "false"
  quarkus.mailer.port: "3025"
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: parasol-db-creds
data:
  quarkus.datasource.username: bm9uX2RldGVybWluaXN0aWM=
  quarkus.datasource.password: bm9uX2RldGVybWluaXN0aWM=
---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: parasol-db-config
data:
  POSTGRES_DB: bm9uX2RldGVybWluaXN0aWM=
  POSTGRES_USER: bm9uX2RldGVybWluaXN0aWM=
  POSTGRES_PASSWORD: bm9uX2RldGVybWluaXN0aWM=
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 3Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: otel-lgtm-data-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 8Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: non-deterministic-db
  labels:
    app.openshift.io/runtime: postgresql
    app.kubernetes.io/part-of: parasol-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      name: non-deterministic-db
  template:
    metadata:
      labels:
        name: non-deterministic-db
    spec:
      containers:
        - name: non-deterministic-db
          image: postgres:18
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: parasol-db-config
          volumeMounts:
            - mountPath: /var/lib/postgresql
              name: db-data
          resources:
            limits:
              memory: 128Mi
            requests:
              memory: 32Mi
      volumes:
        - name: db-data
          persistentVolumeClaim:
            claimName: db-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: non-deterministic-db
spec:
  ports:
    - port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    name: non-deterministic-db
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
spec:
  selector:
    app: lgtm
  ports:
    - name: grafana
      protocol: TCP
      port: 3000
      targetPort: 3000
    - name: otel-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317
    - name: otel-http
      protocol: TCP
      port: 4318
      targetPort: 4318
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-lgtm
  labels:
    app.kubernetes.io/part-of: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.35.0
          ports:
            - containerPort: 3000
            - containerPort: 4317
            - containerPort: 4318
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 128Mi
          volumeMounts:
            - mountPath: /data
              name: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otel-lgtm-data-pvc
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: grafana
spec:
  port:
    targetPort: grafana
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: lgtm
---
# Mail stack, mirroring compose-devservices.yml (same images, same environment).
# GreenMail: SMTP (3025) + IMAP (3143) + REST API (8080), auth disabled, mailboxes auto-created.
# Mail is kept in memory only, so a pod restart loses it. Internal only: no Route.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: greenmail
  labels:
    app.kubernetes.io/part-of: parasol-insurance
spec:
  replicas: 1
  selector:
    matchLabels:
      name: greenmail
  template:
    metadata:
      labels:
        name: greenmail
    spec:
      containers:
        - name: greenmail
          image: docker.io/greenmail/standalone:2.1.14
          ports:
            - containerPort: 3025
              name: smtp
            - containerPort: 3143
              name: imap
            - containerPort: 8080
              name: api
          readinessProbe:
            httpGet:
              path: /api/service/readiness
              port: api
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: greenmail
spec:
  ports:
    - port: 3025
      protocol: TCP
      targetPort: smtp
      name: smtp
    - port: 3143
      protocol: TCP
      targetPort: imap
      name: imap
    - port: 8080
      protocol: TCP
      targetPort: api
      name: api
  selector:
    name: greenmail
  type: ClusterIP
---
# Roundcube webmail: log in as any address with any password. Sends and reads mail through greenmail only.
# Runs under OpenShift's restricted SCC (arbitrary UID) because ROUNDCUBEMAIL_DB_DIR points its SQLite DB at a
# writable path; /var/roundcube is owned by www-data. Sessions and settings are lost on a pod restart.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  labels:
    app.kubernetes.io/part-of: parasol-insurance
  annotations:
    app.openshift.io/connects-to: greenmail
spec:
  replicas: 1
  selector:
    matchLabels:
      name: roundcube
  template:
    metadata:
      labels:
        name: roundcube
    spec:
      containers:
        - name: roundcube
          image: docker.io/roundcube/roundcubemail:1.7.4-apache-nonroot
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: greenmail
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "3143"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: greenmail
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "3025"
            - name: ROUNDCUBEMAIL_DB_DIR
              value: /tmp/roundcube-db
          readinessProbe:
            httpGet:
              path: /
              port: http
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: roundcube
spec:
  ports:
    - port: 8000
      protocol: TCP
      targetPort: http
      name: http
  selector:
    name: roundcube
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: roundcube
spec:
  port:
    targetPort: http
  tls:
    insecureEdgeTerminationPolicy: Redirect
    termination: edge
  to:
    kind: Service
    name: roundcube
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: langfuse-web
spec:
  port:
    targetPort: http
  to:
    kind: Service
    name: langfuse-web
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow