name: Simple build and test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.github/workflows/simple-build-test.yml'
      - '.github/workflows/dependabot-automerge.yml'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - '.github/dependabot.yml'
      - '.github/workflows/simple-build-test.yml'
      - '.github/workflows/dependabot-automerge.yml'
  workflow_dispatch:

concurrency:
  group: "workflow = ${{ github.workflow }}, ref = ${{ github.event.ref }}, pr = ${{ github.event.pull_request.id }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  jvm-build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java:
          - '25'
        ai-provider:
          - ollama
          - ollama-openai
    name: "jvm-build-test-${{ matrix.java }}-${{ matrix.ai-provider }}"
    # Both Ollama profiles expect an Ollama on localhost:11434: %ollama-openai points its base-url
    # there explicitly, and %ollama falls back to the same default once the extension's Dev Service
    # is disabled below. One service container serves both, instead of the Dev Service recreating a
    # container per augmentation and leaving earlier builds pointed at a dead port.
    services:
      ollama:
        image: ollama/ollama
        ports:
          - 11434:11434
        options: --name ollama --rm
    steps:
      - uses: actions/checkout@v7

      - name: Pull Ollama models
        run: |
          # `ollama serve` races an immediate pull, so wait for the API before asking for anything
          for _ in {1..30}; do
            curl -sf http://localhost:11434/api/tags > /dev/null && break
            sleep 2
          done
          # qwen3:4b is only used by generate-email under %ollama - it's the one model measured to reproduce
          # EMAIL_ENDING verbatim for EmailEndsAppropriatelyOutputGuardrail. See application.yml.
          docker exec ollama bash -c "\
            ollama pull granite4:micro && \
            ollama pull qwen3:4b && \
            ollama pull snowflake-arctic-embed && \
            ollama ls"

      - name: Setup Java ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: "build-test-jvm-java${{ matrix.java }}-${{ matrix.ai-provider }}"
        env:
          OPENAI_API_KEY: change-me
          COHERE_API_KEY: change-me
          GEMINI_API_KEY: change-me
        run: |
          ./mvnw -B clean verify \
            -P${{ matrix.ai-provider }} \
            -Dquarkus.http.host=0.0.0.0 \
            -Dmaven.compiler.release=${{ matrix.java }} \
            -Dquarkus.langchain4j.ollama.devservices.enabled=false
